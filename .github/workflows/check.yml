name: Check for ballots

on:
  schedule:
    - cron: '*/15 * * * *' # GitHub may run this a few minutes late at busy times
  workflow_dispatch: # "Run workflow" button for a manual check
    inputs:
      test:
        description: Just send a test notification (saves nothing)
        type: boolean
        default: false

permissions:
  contents: write # to commit state.json

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - name: Check Arsenal's fixtures for ballots
        run: npm run check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFICATION: ${{ inputs.test }}
      - name: Save what was seen
        if: always()
        run: |
          git diff --quiet state.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update ballot state' state.json
          git pull --rebase origin main # in case a code change was pushed during the check
          git push
