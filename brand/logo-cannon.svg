<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Navy background, full-bleed so X's circular crop looks right -->
  <rect width="400" height="400" fill="#0C1E3C"/>

  <!-- Red shirt, white sleeves with red cuffs, white collar -->
  <path d="M110 108 L165 88 Q200 116 235 88 L290 108 L290 340 Q290 350 280 350 L120 350 Q110 350 110 340 Z" fill="#E0242B"/>
  <path d="M110 108 L50 160 L82 214 L110 196 Z" fill="#FFFFFF"/>
  <path d="M290 108 L350 160 L318 214 L290 196 Z" fill="#FFFFFF"/>
  <path d="M61 151 L93 205" stroke="#E0242B" stroke-width="10"/>
  <path d="M339 151 L307 205" stroke="#E0242B" stroke-width="10"/>
  <path d="M165 88 Q200 116 235 88" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>

  <!-- Ticket going into the chest slot -->
  <clipPath id="above-slot"><rect width="400" height="204"/></clipPath>
  <g clip-path="url(#above-slot)">
    <g transform="rotate(-6 200 170)">
      <path d="M160 116 h80 a6 6 0 0 1 6 6 v22 a10 10 0 0 0 0 20 v60 h-92 v-60 a10 10 0 0 0 0 -20 v-22 a6 6 0 0 1 6 -6 z" fill="#FFFFFF"/>
      <line x1="226" y1="126" x2="226" y2="210" stroke="#E0242B" stroke-width="4" stroke-dasharray="5 5" stroke-linecap="round"/>
      <text x="190" y="172" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="38" fill="#E0242B">N5</text>
      <rect x="168" y="182" width="44" height="7" rx="3.5" fill="#F3A5A8"/>
    </g>
  </g>
  <rect x="146" y="196" width="108" height="16" rx="8" fill="#7A0B10"/>

  <!-- Field gun on the lower shirt (our own drawing, not the club's crest cannon) -->
  <g transform="translate(200 300) scale(0.94) translate(-186 -302)">
  <!-- Carriage trail, behind everything -->
  <path d="M128 294 L204 290 L206 308 L126 342 Q110 347 104 338 Z" fill="#0C1E3C" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Barrel: cascabel, tapered tube with reinforcing rings, flared muzzle -->
  <g transform="rotate(-13 182 292)">
    <circle cx="112" cy="290" r="8" fill="#FFFFFF"/>
    <rect x="114" y="285" width="14" height="10" fill="#FFFFFF"/>
    <path d="M132 272 Q124 272 124 280 L124 300 Q124 308 132 308 L246 300 L246 280 Z" fill="#FFFFFF"/>
    <path d="M244 279 L262 276 Q272 275 272 282 L272 298 Q272 305 262 304 L244 301 Z" fill="#FFFFFF"/>
    <rect x="140" y="271.5" width="6" height="37" fill="#7A0B10"/>
    <rect x="188" y="275" width="5" height="30" fill="#7A0B10"/>
    <rect x="240" y="279" width="5" height="22" fill="#7A0B10"/>
    <rect x="262" y="275.5" width="4" height="29" fill="#7A0B10"/>
    <circle cx="180" cy="298" r="6" fill="#0C1E3C"/>
  </g>
  <!-- Spoked wheel in front -->
  <circle cx="182" cy="316" r="27" fill="#7A0B10"/>
  <circle cx="182" cy="316" r="27" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <circle cx="182" cy="316" r="27" fill="none" stroke="#0C1E3C" stroke-width="1.5"/>
  <path d="M189.0 316.0 L205.0 316.0 M188.1 319.5 L201.9 327.5 M185.5 322.1 L193.5 335.9 M182.0 323.0 L182.0 339.0 M178.5 322.1 L170.5 335.9 M175.9 319.5 L162.1 327.5 M175.0 316.0 L159.0 316.0 M175.9 312.5 L162.1 304.5 M178.5 309.9 L170.5 296.1 M182.0 309.0 L182.0 293.0 M185.5 309.9 L193.5 296.1 M188.1 312.5 L201.9 304.5" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="182" cy="316" r="8" fill="#FFFFFF"/>
  <circle cx="182" cy="316" r="3" fill="#0C1E3C"/>
  </g>
</svg>
