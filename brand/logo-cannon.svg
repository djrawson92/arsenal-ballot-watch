<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Navy background, full-bleed so X's circular crop looks right -->
  <rect width="400" height="400" fill="#0C1E3C"/>

  <!-- Red shirt, white sleeves with red cuffs, white collar -->
  <path d="M110 108 L165 88 Q200 116 235 88 L290 108 L290 340 Q290 350 280 350 L120 350 Q110 350 110 340 Z" fill="#E0242B"/>
  <path d="M110 108 L50 160 L82 214 L110 196 Z" fill="#FFFFFF"/>
  <path d="M290 108 L350 160 L318 214 L290 196 Z" fill="#FFFFFF"/>
  <path d="M61 151 L93 205" stroke="#E0242B" stroke-width="10"/>
  <path d="M339 151 L307 205" stroke="#E0242B" stroke-width="10"/>
  <path d="M165 88 Q200 116 235 88" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>

  <!-- Ticket going into the chest slot -->
  <clipPath id="above-slot"><rect width="400" height="204"/></clipPath>
  <g clip-path="url(#above-slot)">
    <g transform="rotate(-6 200 170)">
      <path d="M160 116 h80 a6 6 0 0 1 6 6 v22 a10 10 0 0 0 0 20 v60 h-92 v-60 a10 10 0 0 0 0 -20 v-22 a6 6 0 0 1 6 -6 z" fill="#FFFFFF"/>
      <line x1="226" y1="126" x2="226" y2="210" stroke="#E0242B" stroke-width="4" stroke-dasharray="5 5" stroke-linecap="round"/>
      <text x="190" y="172" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="38" fill="#E0242B">N5</text>
      <rect x="168" y="182" width="44" height="7" rx="3.5" fill="#F3A5A8"/>
    </g>
  </g>
  <rect x="146" y="196" width="108" height="16" rx="8" fill="#7A0B10"/>

  <!-- Cartoon field cannon on the lower shirt (deliberately not the club's crest cannon) -->
  <g transform="rotate(-14 200 290)">
    <circle cx="140" cy="290" r="9" fill="#FFFFFF"/>
    <path d="M150 274 L250 279 Q258 280 258 290 Q258 300 250 301 L150 306 Q140 306 140 290 Q140 274 150 274 Z" fill="#FFFFFF"/>
    <rect x="248" y="272" width="14" height="36" rx="5" fill="#FFFFFF" stroke="#E0242B" stroke-width="3"/>
    <rect x="184" y="276" width="7" height="28" rx="3" fill="#E0242B"/>
  </g>
  <circle cx="180" cy="318" r="22" fill="#FFFFFF"/>
  <circle cx="180" cy="318" r="22" fill="none" stroke="#E0242B" stroke-width="3"/>
  <path d="M180 299 V337 M161 318 H199 M167 305 L193 331 M193 305 L167 331" stroke="#E0242B" stroke-width="3.5"/>
  <circle cx="180" cy="318" r="6" fill="#E0242B"/>
</svg>
