<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <rect width="1500" height="500" fill="#0C1E3C"/>

  <!-- Red-and-white "sleeve" stripes, top-left (the profile photo covers the bottom-left) -->
  <g transform="rotate(-24 0 0)">
    <rect x="-200" y="40" width="760" height="70" fill="#E0242B"/>
    <rect x="-200" y="110" width="760" height="22" fill="#FFFFFF"/>
    <rect x="-200" y="132" width="760" height="26" fill="#E0242B"/>
  </g>

  <!-- Title -->
  <g font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" text-anchor="middle">
    <text x="680" y="232" font-size="74" fill="#FFFFFF">AFC BALLOT ALERTS</text>
  </g>
  <rect x="530" y="260" width="300" height="10" rx="5" fill="#E0242B"/>
  <text x="680" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#C9D3E6">Unofficial alerts when ticket ballots open</text>

  <!-- Tickets, right -->
  <g transform="translate(1270 262) rotate(14)">
    <path d="M-80 -110 h160 a8 8 0 0 1 8 8 v54 a18 18 0 0 0 0 36 v124 a8 8 0 0 1 -8 8 h-160 a8 8 0 0 1 -8 -8 v-124 a18 18 0 0 0 0 -36 v-54 a8 8 0 0 1 8 -8 z" fill="#FFFFFF"/>
    <line x1="52" y1="-96" x2="52" y2="104" stroke="#E0242B" stroke-width="5" stroke-dasharray="8 8" stroke-linecap="round" opacity="0.8"/>

    <rect x="-70" y="-70" width="54" height="12" rx="6" fill="#E0242B" opacity="0.35"/>
    <rect x="-70" y="-44" width="40" height="12" rx="6" fill="#E0242B" opacity="0.35"/>
  </g>
  <g transform="translate(1360 250) rotate(-10)">
    <path d="M-80 -110 h160 a8 8 0 0 1 8 8 v54 a18 18 0 0 0 0 36 v124 a8 8 0 0 1 -8 8 h-160 a8 8 0 0 1 -8 -8 v-124 a18 18 0 0 0 0 -36 v-54 a8 8 0 0 1 8 -8 z" fill="#E0242B"/>
    <line x1="52" y1="-96" x2="52" y2="104" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="8 8" stroke-linecap="round" opacity="0.8"/>
    <text x="-14" y="-24" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF">N5</text>
    <rect x="-62" y="2" width="92" height="12" rx="6" fill="#FFFFFF" opacity="0.35"/>
    <rect x="-62" y="28" width="66" height="12" rx="6" fill="#FFFFFF" opacity="0.35"/>
  </g>

</svg>
