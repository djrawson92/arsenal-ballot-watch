<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  body { width: 1000px; height: 1000px; }
  .tile { width: 1000px; height: 1000px; display: flex; flex-direction: column; align-items: center; justify-content: center;
          background: radial-gradient(circle at 50% 40%, #DE1E3A 0%, var(--red) 45%, var(--red-dark) 100%); }
  .icon { width: 430px; transform: rotate(-8deg); margin-top: -20px; filter: drop-shadow(0 14px 22px rgba(0,0,0,.25)); }
  .eyebrow { font: 600 64px/1 Oswald; letter-spacing: 18px; color: rgba(255,255,255,.88); margin: 54px 0 0 18px; }
  .name { font: 700 118px/1 Oswald; color: var(--white); letter-spacing: 2px; margin-top: 14px; }
</style></head><body>
  <div class="tile">
    <img class="icon" src="icon.svg" alt="">
    <div class="eyebrow">ARSENAL</div>
    <div class="name">BALLOT ALERTS</div>
  </div>
</body></html>
